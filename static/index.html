<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Log Admin - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>📊 개발 로그 통합 대시보드</h1>
            <nav class="nav">
                <a href="/" class="nav-link active">Dashboard</a>
                <a href="/search.html" class="nav-link">Search</a>
                <button onclick="reloadData()" class="reload-btn">🔄 Reload</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">전체 프로젝트</div>
                <div class="stat-value" id="totalProjects">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">전체 커밋</div>
                <div class="stat-value" id="totalCommits">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최근 활동</div>
                <div class="stat-value-small" id="recentActivity">-</div>
            </div>
        </section>

        <section class="chart-section">
            <h2>커밋 타입 분포</h2>
            <div id="typeChart" class="type-chart"></div>
        </section>

        <section class="section">
            <h2>프로젝트 목록</h2>
            <div id="projectsGrid" class="projects-grid"></div>
        </section>

        <section class="section">
            <h2>최근 커밋</h2>
            <div id="recentList" class="recent-list"></div>
        </section>
    </main>

    <footer class="footer">
        <p>Dev Log Admin v1.0 | SQLite Backend</p>
    </footer>

    <script src="app.js?v=2026020523"></script>
</body>
</html>
